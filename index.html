<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tushar Gold</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SHOP HEADER -->
    <header class="shop-header">

        <h1>TUSHAR GOLD</h1>

        <p>Premium Imitation Jewellery</p>

    </header>


    <!-- SHOP BANNER -->
    <section class="banner">

        <img
            src="banner.png"
            alt="Tushar Gold Shop Banner"
        >

    </section>


    <!-- SPIN WHEEL SECTION -->
    <section class="spin-section">

        <h2>🎁 SPIN & WIN 🎁</h2>

        <p>
            চাকা ঘুরিয়ে জিতে নিন আকর্ষণীয় পুরস্কার!
        </p>


        <!-- WHEEL -->
        <div class="wheel-container">

            <div class="pointer">
                ▼
            </div>

            <canvas
                id="wheel"
                width="400"
                height="400">
            </canvas>

        </div>


        <!-- SPIN BUTTON -->
        <button id="spinBtn">
            🎡 SPIN NOW
        </button>


        <!-- RESULT POPUP -->
        <div id="result"></div>

    </section>


    <!-- FIRST BOX -->
    <section class="visit-again">

        <h2>TUSHAR GOLD</h2>

        <p>
            Premium Imitation Jewellery
        </p>

        <div class="visit-line"></div>

        <p class="footer-copy">
            ✨ Thank You For Visiting ✨
        </p>

    </section>


    <!-- SECOND BOX -->
    <section class="visit-again">

        <div class="visit-icon">
            
        </div>

        <h2>
            আরও একবার ভাগ্য পরীক্ষা করুন!
        </h2>

        <div class="visit-line"></div>

        <h3>
            BUY AGAIN & WIN AGAIN
        </h3>

        <p>
            🎁 Tushar Gold-এ আবার Visit করুন
            এবং নতুন করে Spin করুন!
        </p>

    </section>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
